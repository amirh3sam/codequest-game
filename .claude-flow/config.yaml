# RuFlo V3 Runtime Configuration
# CodeQuest uses Ruflo as a local task and memory ledger.

version: "3.0.0"

swarm:
  topology: hierarchical
  maxAgents: 1
  autoScale: false
  coordinationStrategy: consensus

memory:
  backend: hybrid
  enableHNSW: true
  persistPath: .swarm
  cacheSize: 100
  # ADR-049: Self-Learning Memory
  learningBridge:
    enabled: false
    sonaMode: balanced
    confidenceDecayRate: 0.005
    accessBoostAmount: 0.03
    consolidationThreshold: 10
  memoryGraph:
    enabled: false
    pageRankDamping: 0.85
    maxNodes: 5000
    similarityThreshold: 0.8
  agentScopes:
    enabled: false
    defaultScope: project

neural:
  enabled: false
  modelPath: .claude-flow/neural

hooks:
  enabled: false
  autoExecute: false

mcp:
  autoStart: false
  port: 3000
